<svg width="800" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2980" />
      <stop offset="100%" stop-color="#26D0CE" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF">
        <animate attributeName="stop-color" values="#FFF;#FFD700;#FFF" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#E0E0E0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="800" height="200" fill="url(#bgGradient)" rx="15" ry="15" />
  
  <g>
    <!-- Simple animated box to simulate a shipping package -->
    <rect x="50" y="80" width="40" height="40" fill="#FFA500" rx="5" ry="5">
      <animate attributeName="x" values="50; 700; 50" dur="10s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" type="rotate" values="0 70 100; 360 720 100" dur="10s" repeatCount="indefinite" />
    </rect>
  </g>
  
  <text x="400" y="90" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="url(#textGradient)" text-anchor="middle" filter="url(#glow)">
    Awesome Shipping &amp; Fulfillment
  </text>
  <text x="400" y="130" font-family="Arial, sans-serif" font-size="20" fill="#E0E0E0" text-anchor="middle">
    Top SaaS &amp; Open-Source Tools Ecosystem
  </text>
  <text x="400" y="160" font-family="Arial, sans-serif" font-size="14" fill="#A0C0FF" text-anchor="middle">
    <animate attributeName="opacity" values="0.5; 1; 0.5" dur="2s" repeatCount="indefinite" />
    🚀 Explore the ultimate curated list for ecommerce 🚀
  </text>
</svg>
